name: Qwick
description: 'Qwick is an AI-powered workforce management platform for the hospitality
  industry, connecting businesses with vetted hospitality professionals ("Pros") for
  on-demand shifts across 42 states. Its products span the Marketplace (intelligent
  shift matching), QwickGo (same-day shift posting), Jobs (performance-based hiring
  with paid working interviews), Compliance (scheduling and time-tracking rules enforcement),
  and Pay (multi-state W-2 and 1099 payroll). Qwick documents a REST API (v2) plus
  webhooks for custom integrations exposing shifts, pros, hours, invoices, and compliance
  data, and pre-built integrations with payroll (ADP, Gusto, Paychex, Paycom), POS
  (Toast, Square, Lightspeed), HRIS (Workday, BambooHR), scheduling (7shifts, Deputy,
  When I Work), and SSO (Okta, Microsoft Entra, Google Workspace). It is headquartered
  in Charleston, SC and backed by Foundry Group.'
